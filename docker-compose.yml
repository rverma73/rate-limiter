services:

  api:
    build: .
    container_name: rate-limiter-api
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: rate-limiter-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rate_limiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: